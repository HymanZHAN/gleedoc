name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gleam: ["1.16.0", "1.19.2"]
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: ${{ matrix.gleam }}
          rebar3-version: "3"
      - run: gleam deps download
      - if: matrix.gleam == '1.19.2'
        run: gleam format --check src test dev
      - run: gleam test
